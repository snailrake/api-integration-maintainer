services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: maintainer
      POSTGRES_USER: maintainer
      POSTGRES_PASSWORD: maintainer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "maintainer", "-d", "maintainer"]
      interval: 5s
      start_period: 2m

volumes:
  postgres-data:
